# MikroTik Traffic Monitor - nginx vhost.
#
# The billing panel is the default_server (server_name _), so it answers anything
# that does not match a name here. Naming this vhost explicitly means the monitor
# only ever answers on its own sub-domain and the panel is untouched.
#
# Replace __TM_SERVER_NAME__ with the sub-domain, e.g. monitor.example.com
server {
    listen 80;
    listen [::]:80;
    server_name __TM_SERVER_NAME__;

    root /var/www/traffic-monitor;
    index index.php;

    access_log /var/log/nginx/traffic-monitor.access.log;
    error_log  /var/log/nginx/traffic-monitor.error.log;

    client_max_body_size 4m;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # A first poll over several routers can take a while when one is offline.
        fastcgi_read_timeout 120s;
    }

    # includes/ holds PHP only, but denying it outright means a future .txt or .bak
    # dropped in there can never be served either.
    location ~ ^/(includes)/ { deny all; }
    location ~ /\.           { deny all; }

    location ~* \.(js|css|png|jpg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
